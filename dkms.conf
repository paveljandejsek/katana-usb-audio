PACKAGE_NAME="katana-usb-audio"
PACKAGE_VERSION="1.0"

# Built modules
BUILT_MODULE_NAME[0]="katana_usb_audio"
BUILT_MODULE_LOCATION[0]="."
# Note: Debian and Red Hat based distros ignore this and install to
# /lib/modules/<kernel>/extra regardless - verified on Fedora, where the module
# lands in extra/ as katana_usb_audio.ko.xz. DKMS still requires the variable to
# be set, and it is honoured elsewhere, so it stays. Relevant because `make
# install` also targets extra/: see the warning in the Makefile's install target.
DEST_MODULE_LOCATION[0]="/kernel/sound/usb/"

# Autoinstall
AUTOINSTALL="yes"

# No CLEAN step: DKMS deletes its build directory and re-copies the source tree
# into it before every build, and DKMS 3.x deprecates CLEAN (it only prints a
# warning and is never run). That makes the source tree in /usr/src the thing
# to keep free of build output, which is install-dkms.sh's job.

# Make command
MAKE[0]="make all"

# snd-usb-audio is kept off the Katana by 99-katana-usb-audio.rules. dkms.conf
# has no setting for that: CONFLICTS is not a DKMS variable and is ignored.