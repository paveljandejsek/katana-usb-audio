PACKAGE_NAME="katana-usb-audio"
PACKAGE_VERSION="1.0"

# Built modules
BUILT_MODULE_NAME[0]="katana_usb_audio"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/kernel/sound/usb/"

# Autoinstall
AUTOINSTALL="yes"

# Clean command. Required: dkms copies the whole source directory to /usr/src/,
# including any .o/.ko left over from a manual `make`. Without this, make finds
# those targets newer than the sources, does nothing, exits 0, and dkms reports
# a successful build of a module with the wrong vermagic.
CLEAN="make clean"

# Make command
MAKE[0]="make all"

# Module conflicts (replaces deprecated MODULES_CONF_OBSOLETES)
CONFLICTS="snd-usb-audio" 